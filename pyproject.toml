[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wechat-aumac"
version = "0.3.3"
description = "Control macOS WeChat through version-pinned internal functions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WeChat auMac contributors" }]
keywords = ["wechat", "macos", "wxauto", "automation", "native-functions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
hook = ["frida>=17,<18"]
resources = ["Pillow>=10", "zstandard>=0.22"]

[project.scripts]
wechat-aumac = "wechat_aumac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_aumac"]
